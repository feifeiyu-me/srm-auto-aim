gimbal_follower_node:
  ros__parameters:
    mode: simulation
    calibration_verified: false
    # This acknowledgement is ONLY for the synthetic scene in simulation.launch.py.
    allow_unverified_simulation_calibration: true
    camera_to_gimbal_quaternion_xyzw: [-0.5, 0.5, -0.5, 0.5]
    camera_to_gimbal_translation_m: [0.0, 0.0, 0.0]
    yaw_feedback_sign: 1.0
    pitch_feedback_sign: -1.0
    roll_feedback_sign: 1.0
    yaw_zero_deg: 0.0
    pitch_zero_deg: 0.0
    roll_zero_deg: 0.0
    kp: 0.6
    deadband_deg: 0.1
    max_step_deg: 1.5
    max_rate_deg_sec: 30.0
    max_visual_correction_deg: 30.0
    yaw_min_deg: -170.0
    yaw_max_deg: 170.0
    pitch_min_deg: -45.0
    pitch_max_deg: 45.0
    visual_timeout_sec: 0.30
    feedback_timeout_sec: 0.15
    alignment_gap_sec: 0.10
    history_sec: 1.0
    history_capacity: 200
    feedback_max_jump_deg: 20.0
    feedback_max_rate_deg_sec: 200.0
    allow_target_switch: true
    target_switch_delay_sec: 0.30
    target_switch_confirm_sec: 0.15
gimbal_follower_simulator:
  ros__parameters:
    publish_visual: true
    publish_feedback: true
    invalid_visual: false
    invalid_feedback: false
    target_id: 1
    target_yaw_flu_deg: -10.0
    target_pitch_up_deg: 6.0
